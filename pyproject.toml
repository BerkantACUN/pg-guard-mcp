[project]
name = "pg-guard-mcp"
version = "0.1.0"
description = "A PostgreSQL MCP server that enforces read-only access at the protocol and privilege level — not by parsing the query string."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Berkant Acun" }]
keywords = ["mcp", "model-context-protocol", "postgresql", "postgres", "read-only", "security"]
dependencies = [
    "mcp>=1.2.0",
    "psycopg[binary]>=3.2.0",
]

[project.scripts]
pg-guard-mcp = "pg_guard_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pg_guard_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
